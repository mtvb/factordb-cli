[package]
name = "fdb-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line client for the factordb JSON-RPC API"
license = "GPL-2.0-only"
authors = ["Markus Tervooren"]

[[bin]]
name = "fdb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2"
clap = { version = "4.6.7", features = ["derive", "wrap_help", "env"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
ureq = { version = "3.4.2", default-features = false, features = ["gzip", "rustls", "platform-verifier"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
